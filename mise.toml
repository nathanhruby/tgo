min_version = "2024.1.1"

[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
hk = "1.53.0"

[tasks.build]
run = "go build -o dist/tgo"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.check]
run = "hk run check --all --check"

[tasks."check:ci"]
run = "hk run check --all --check --skip-step golangci-lint"

[tasks.pr-title]
run = ".mise/tasks/pr-title"

[tasks."hooks:install"]
run = "hk install --mise"
