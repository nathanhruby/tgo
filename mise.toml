min_version = "2024.1.1"

[tools]
go = "1.27.0"
golangci-lint = "2.13.2"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
hk = "1.56.1"
goreleaser = "2.18.0"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.build]
run = "go build -o dist/tgo"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.check]
run = "hk run check --all --check"

[tasks."check:ci"]
run = "hk run check --all --check --skip-step golangci-lint"

[tasks.release]
run = "goreleaser release --clean"

[tasks.pr-title]
run = ".mise/tasks/pr-title"

[tasks."hooks:install"]
run = "hk install --mise"
