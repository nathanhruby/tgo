---
name: golang-ci
"on":
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  golangci:
    name: Run golang-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: 2026.10.17
          install: true
      - name: Run lint
        run: mise run lint
