---
name: golangci
"on":
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  golangci:
    name: Run golang-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          version: 2026.8.6
          install: true
      - name: Run lint
        run: mise run lint
