---
name: go tests
"on":
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  golangci:
    name: Run go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550  # v5.2.2
        with:
          version: 2026.10.25
          install: true
      - name: Run lint
        run: mise run test
